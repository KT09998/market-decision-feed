name: Collect market bridge

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Collection stage
        required: true
        type: choice
        default: "1030"
        options:
          - "0000"
          - "0850"
          - "1030"
      test_mode:
        description: Validate APIs and output without publishing a latest file
        required: true
        type: boolean
        default: true
  schedule:
    # Asia/Taipei 23:40, 23:50, 23:58, 00:06 (UTC cron; the first three runs target the next Taipei date).
    - cron: "40 15 * * *"
    - cron: "50 15 * * *"
    - cron: "58 15 * * *"
    - cron: "6 16 * * *"
    # Weekdays at Asia/Taipei 08:45, 08:50, 08:55.
    - cron: "45 0 * * 1-5"
    - cron: "50 0 * * 1-5"
    - cron: "55 0 * * 1-5"
    # Weekdays at Asia/Taipei 10:27, 10:30, 10:35, 10:40.
    - cron: "27 2 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "35 2 * * 1-5"
    - cron: "40 2 * * 1-5"
    # Late fallback attempts through Asia/Taipei 11:30 in case a scheduled run is delayed.
    - cron: "45 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "15 3 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "45 3 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "15 4 * * 1-5"
    - cron: "30 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-decision-feed-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve stage and mode
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_TEST_MODE: ${{ inputs.test_mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            stage="$INPUT_STAGE"
            test_mode="$INPUT_TEST_MODE"
          else
            test_mode="false"
            case "$SCHEDULE" in
              "40 15 * * *"|"50 15 * * *"|"58 15 * * *"|"6 16 * * *") stage="0000" ;;
              "45 0 * * 1-5"|"50 0 * * 1-5"|"55 0 * * 1-5") stage="0850" ;;
              "27 2 * * 1-5"|"30 2 * * 1-5"|"35 2 * * 1-5"|"40 2 * * 1-5"|"45 2 * * 1-5"|"0 3 * * 1-5"|"15 3 * * 1-5"|"30 3 * * 1-5"|"45 3 * * 1-5"|"0 4 * * 1-5"|"15 4 * * 1-5"|"30 4 * * 1-5") stage="1030" ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"

      - name: Run self-test
        run: node scripts/collect-market.mjs --self-test

      - name: Collect public market data
        shell: bash
        env:
          STAGE: ${{ steps.vars.outputs.stage }}
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
          SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--stage "$STAGE")
          if [[ "$TEST_MODE" == "true" ]]; then args+=(--test-mode); fi
          node scripts/collect-market.mjs "${args[@]}"

      - name: Verify collection and publication contract
        shell: bash
        env:
          STAGE: ${{ steps.vars.outputs.stage }}
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const stage = process.env.STAGE;
          const status = JSON.parse(fs.readFileSync(`status_${stage}.json`, 'utf8'));
          if (status.stage !== stage) throw new Error(`status stage mismatch: ${status.stage}`);
          if (!status.targetDate || !status.generatedAt || !status.collection) throw new Error('status publication metadata is incomplete');
          if (process.env.TEST_MODE !== 'true' && status.status === 'READY') {
            const latest = JSON.parse(fs.readFileSync(`latest_${stage}.json`, 'utf8'));
            if (latest.status !== 'READY' || latest.stage !== stage || latest.targetDate !== status.targetDate || latest.collection?.latestUpdated !== true) {
              throw new Error('READY status was not published as a matching latest file');
            }
          }
          console.log(`PUBLICATION_CONTRACT_OK stage=${stage} status=${status.status} targetDate=${status.targetDate} latestUpdated=${status.collection.latestUpdated}`);
          NODE

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bridge-${{ steps.vars.outputs.stage }}-${{ github.run_id }}
          path: |
            status_${{ steps.vars.outputs.stage }}.json
            latest_${{ steps.vars.outputs.stage }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit collection status
        if: ${{ success() }}
        shell: bash
        env:
          STAGE: ${{ steps.vars.outputs.stage }}
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
        run: |
          set -euo pipefail
          git add "status_${STAGE}.json"
          if [[ "$TEST_MODE" != "true" ]]; then git add "latest_${STAGE}.json"; fi
          if git diff --cached --quiet; then
            echo "No collection status change to commit."
            exit 0
          fi
          target_date="$(node -e "console.log(JSON.parse(require('fs').readFileSync('status_${STAGE}.json','utf8')).targetDate)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$TEST_MODE" == "true" ]]; then
            git commit -m "data: test ${STAGE} ${target_date}"
          else
            git commit -m "data: collect ${STAGE} ${target_date}"
          fi
          git push origin HEAD:main
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          git status --short --branch
