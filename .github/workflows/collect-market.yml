name: Collect market bridge

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Collection stage
        required: true
        type: choice
        default: "1030"
        options:
          - "0000"
          - "0850"
          - "1030"
      test_mode:
        description: Validate APIs and output without publishing a latest file
        required: true
        type: boolean
        default: true
  schedule:
    # Asia/Taipei 23:55, 00:01, 00:06 (UTC cron; the first run targets the next Taipei date).
    - cron: "55 15 * * *"
    - cron: "1 16 * * *"
    - cron: "6 16 * * *"
    # Weekdays at Asia/Taipei 08:45, 08:50, 08:55.
    - cron: "45 0 * * 1-5"
    - cron: "50 0 * * 1-5"
    - cron: "55 0 * * 1-5"
    # Weekdays at Asia/Taipei 10:27, 10:30, 10:35, 10:40.
    - cron: "27 2 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "35 2 * * 1-5"
    - cron: "40 2 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-decision-feed-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve stage and mode
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_TEST_MODE: ${{ inputs.test_mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            stage="$INPUT_STAGE"
            test_mode="$INPUT_TEST_MODE"
          else
            test_mode="false"
            case "$SCHEDULE" in
              "55 15 * * *"|"1 16 * * *"|"6 16 * * *") stage="0000" ;;
              "45 0 * * 1-5"|"50 0 * * 1-5"|"55 0 * * 1-5") stage="0850" ;;
              "27 2 * * 1-5"|"30 2 * * 1-5"|"35 2 * * 1-5"|"40 2 * * 1-5") stage="1030" ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"

      - name: Run self-test
        run: node scripts/collect-market.mjs --self-test

      - name: Collect public market data
        shell: bash
        env:
          STAGE: ${{ steps.vars.outputs.stage }}
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
        run: |
          set -euo pipefail
          args=(--stage "$STAGE")
          if [[ "$TEST_MODE" == "true" ]]; then args+=(--test-mode); fi
          node scripts/collect-market.mjs "${args[@]}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-bridge-${{ steps.vars.outputs.stage }}-${{ github.run_id }}
          path: |
            status_${{ steps.vars.outputs.stage }}.json
            latest_${{ steps.vars.outputs.stage }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit collection status
        if: ${{ success() }}
        shell: bash
        env:
          STAGE: ${{ steps.vars.outputs.stage }}
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
        run: |
          set -euo pipefail
          git add "status_${STAGE}.json"
          if [[ "$TEST_MODE" != "true" ]]; then git add "latest_${STAGE}.json"; fi
          if git diff --cached --quiet; then
            echo "No collection status change to commit."
            exit 0
          fi
          target_date="$(node -e "console.log(JSON.parse(require('fs').readFileSync('status_${STAGE}.json','utf8')).targetDate)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$TEST_MODE" == "true" ]]; then
            git commit -m "data: test ${STAGE} ${target_date}"
          else
            git commit -m "data: collect ${STAGE} ${target_date}"
          fi
          git push
