name: Collect market close bridge

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Validate APIs and output without publishing latest_close.json
        required: true
        type: boolean
        default: true
  schedule:
    # Asia/Taipei 13:35, 13:40, 13:45, 13:50 (UTC cron).
    - cron: "35 5 * * 1-5"
    - cron: "40 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "50 5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-decision-feed-close-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve mode
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TEST_MODE: ${{ inputs.test_mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test_mode="$INPUT_TEST_MODE"
          else
            test_mode="false"
          fi
          echo "test_mode=$test_mode" >> "$GITHUB_OUTPUT"

      - name: Run close self-test
        run: node scripts/collect-close.mjs --self-test

      - name: Collect public close data
        shell: bash
        env:
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$TEST_MODE" == "true" ]]; then args+=(--test-mode); fi
          node scripts/collect-close.mjs "${args[@]}"

      - name: Upload close evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-close-${{ github.run_id }}
          path: |
            status_close.json
            latest_close.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit close status
        if: ${{ success() }}
        shell: bash
        env:
          TEST_MODE: ${{ steps.vars.outputs.test_mode }}
        run: |
          set -euo pipefail
          git add status_close.json
          if [[ "$TEST_MODE" != "true" && -f latest_close.json ]]; then git add latest_close.json; fi
          if git diff --cached --quiet; then
            echo "No close collection status change to commit."
            exit 0
          fi
          target_date="$(node -e "console.log(JSON.parse(require('fs').readFileSync('status_close.json','utf8')).targetDate)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$TEST_MODE" == "true" ]]; then
            git commit -m "data: test close $target_date"
          else
            git commit -m "data: collect close $target_date"
          fi
          git push

